  <rect width="1100" height="180" fill="url(#glowSoft)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 36 H1100"/>
    <path d="M0 72 H1100"/>
    <path d="M0 108 H1100"/>
    <path d="M0 144 H1100"/>
    <path d="M137.5 0 V180"/>
    <path d="M275 0 V180"/>
    <path d="M412.5 0 V180"/>
    <path d="M550 0 V180"/>
    <path d="M687.5 0 V180"/>
    <path d="M825 0 V180"/>
    <path d="M962.5 0 V180"/>
  </g>

  <!-- geometric frame accents -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1">
    <path d="M40 40 H120"/>
    <path d="M40 40 V70"/>
    <path d="M1060 40 H980"/>
    <path d="M1060 40 V70"/>
    <path d="M40 140 H120"/>
    <path d="M40 140 V110"/>
    <path d="M1060 140 H980"/>
    <path d="M1060 140 V110"/>
