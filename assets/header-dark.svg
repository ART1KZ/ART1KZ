  <!-- wordmark + tagline -->
  <text x="168" y="88" fill="#f5f5f5" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="0.18em">ART1KZ</text>
  <text x="168" y="118" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" letter-spacing="0.28em">BACKEND · TOOLING · AGENTS</text>

  <!-- accent line -->
  <rect x="168" y="132" width="220" height="1.5" rx="1" fill="url(#line)"/>

  <!-- right-side geometric motif -->
  <g transform="translate(860,42)" fill="none" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1">
