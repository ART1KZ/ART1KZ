<svg xmlns="http://www.w3.org/2000/svg" width="850" height="230" viewBox="0 0 850 230" role="img" aria-label="Terminal status">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0e12"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>
    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="848" height="228" rx="8" fill="url(#termBg)" stroke="url(#termBorder)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="1" y="1" width="848" height="32" rx="8" fill="#141419"/>
  <rect x="1" y="25" width="848" height="8" fill="#141419"/>
  <line x1="1" y1="33" x2="849" y2="33" stroke="#23232b" stroke-width="1"/>

  <!-- Window buttons -->
  <circle cx="20" cy="17" r="5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="36" cy="17" r="5" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="52" cy="17" r="5" fill="#10b981" fill-opacity="0.8"/>
  <text x="425" y="21" fill="#71717a" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" text-anchor="middle">arem@workstation: ~/workspace</text>

  <!-- Content -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13">
    <!-- Prompt line -->
    <text x="24" y="60">
      <tspan fill="#a78bfa" font-weight="600">arem@workstation</tspan>
      <tspan fill="#71717a">:</tspan>
      <tspan fill="#60a5fa">~</tspan>
      <tspan fill="#71717a">$</tspan>
      <tspan fill="#f4f4f5"> neofetch --profile</tspan>
    </text>

    <!-- Info fields -->
    <text x="24" y="88" fill="#a1a1aa">
      <tspan fill="#c4b5fd" font-weight="600">OS</tspan>           <tspan fill="#71717a">::</tspan> Linux x86_64 / Windows WSL2
    </text>
    <text x="24" y="110" fill="#a1a1aa">
      <tspan fill="#c4b5fd" font-weight="600">Role</tspan>         <tspan fill="#71717a">::</tspan> Backend Systems &amp; Autonomous Agent Tooling
    </text>
    <text x="24" y="132" fill="#a1a1aa">
      <tspan fill="#c4b5fd" font-weight="600">Stack</tspan>        <tspan fill="#71717a">::</tspan> TypeScript, Node.js, NestJS, Postgres, Docker
    </text>
    <text x="24" y="154" fill="#a1a1aa">
      <tspan fill="#c4b5fd" font-weight="600">Workflow</tspan>     <tspan fill="#71717a">::</tspan> OMP Harness + Antigravity (Issue &#8594; Verified Green PR)
    </text>
    <text x="24" y="176" fill="#a1a1aa">
      <tspan fill="#c4b5fd" font-weight="600">Active Repos</tspan> <tspan fill="#71717a">::</tspan> Commercial &amp; Private Eng (Open tooling on GH)
    </text>

    <!-- Interactive cursor -->
    <text x="24" y="204">
      <tspan fill="#a78bfa" font-weight="600">arem@workstation</tspan>
      <tspan fill="#71717a">:</tspan>
      <tspan fill="#60a5fa">~</tspan>
      <tspan fill="#71717a">$</tspan>
      <tspan fill="#a78bfa"> ▋</tspan>
    </text>
  </g>
</svg>
